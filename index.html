function delIt(it){st.items=st.items.filter(x=>x!==it);save();closeOv();render();toast('Obrisano',()=>{st.items.push(it);save();render()})}
function saveF(){const f=F,K=f.k,er=m=>{$('#er').textContent=m};
  if(f.mode==='move'){if(!f.dt)return er('Izaberi datum.');const it=f.it;it.ex[f.k0]={d:f.dt,s:f.s,r:f.room.trim()};save();buzz();closeOv();render();return}
  if(K==='d'&&!f.dt)return er('Izaberi datum.');if(K==='m'&&!f.ds.length)return er('Izaberi bar jedan datum.');
  if(K==='b'&&!f.f)return er('Izaberi prvu nedelju.');if(K==='p'&&(!f.f||!f.u||f.f>f.u))return er('Izaberi ispravan period (Od, Do).');
  if(f.s+(f.n-1)*60+45>1440)return er('Čas ne može da pređe ponoć.');
  const base={name:f.name.trim(),teacher:f.teacher.trim(),room:f.room.trim(),role:f.role,t:f.t,g:f.g.trim(),c:f.c,s:f.s,n:f.n,k:K};
  const wdk='wbenpt'.includes(K),m0=mon(cd),wl=wdk?f.wds:[0];
  const mk=(wd,x)=>Object.assign({id:uid(),ex:{},ds:[],f:'',u:'',dt:'',wd},base,K==='t'?{dt:dk(addD(m0,wd))}:{},K==='d'?{dt:f.dt}:{},K==='m'?{ds:f.ds}:{},K==='b'||K==='p'?{f:f.f}:{},K==='p'?{u:f.u}:{},x);
  if(f.mode==='new'){wl.forEach(wd=>st.items.push(mk(wd)));if(K==='d')cd=fix(pd(f.dt));else if(wdk&&wl.length===1&&vw==='d')cd=addD(m0,wl[0])}
  else if(f.mode==='edit'){const it=f.it;Object.assign(it,mk(wl[0],{id:it.id,ex:it.ex,u:K==='p'?f.u:(it.u||''),f:'wen'.includes(K)?(it.f||''):(K==='b'||K==='p'?f.f:'')}))}
  else{const it=f.it;if(it.f&&f.k0<=it.f)Object.assign(it,mk(wl[0],{id:it.id,ex:it.ex}));
    else{const w=wl[0],nf=K==='b'?(()=>{let d=addD(mon(pd(f.k0)),w);return dk(d<pd(f.k0)?addD(d,14):d)})():f.k0;
      it.u=dk(addD(pd(f.k0),-1));st.items.push(mk(w,{f:nf,u:K==='p'?f.u:''}))}}
  save();buzz();closeOv();render()}

// action sheet for an occurrence
function act(o){const it=o.it,rec='wbenpm'.includes(it.k),fut='wbenp'.includes(it.k),B=(a,t,c)=>`<button class="mb${c?' r':''}" data-a="${a}">${t}</button>`;
  AO=o;$('#mb').innerHTML=`<h2>${esc(it.name)||TY[it.t||'p']}</h2><div class="sub" style="margin-bottom:6px">${fd(pd(o.dd))} · ${fm(o.s)} · ${esc(o.room)||'bez učionice'}</div>`
   +B('ed',rec?'Izmeni sve termine':'Izmeni')+(rec?B('mv','Pomeri / promeni učionicu samo za ovaj termin')+B('cx',o.gone==='Otkazano'?'Vrati otkazani termin':'Otkaži samo ovaj termin'):'')
   +(fut?B('fu','Izmeni ovaj i sve buduće termine'):'')+B('rp','Dodaj zamenski termin')+B('dl','Obriši ceo termin',1)+B('x','Zatvori');
  openOv('#ov2')}
$('#list').addEventListener('click',e=>{
  if(e.target.closest('.lk')){shareLink();return}
  const mc=e.target.closest('.mc');if(mc){cd=fix(pd(mc.dataset.k));vw='d';render();return}
  const r=e.target.closest('.row');if(!r)return;const o=occ(pd(r.dataset.dd)).find(x=>x.it.id===r.dataset.id&&x.k===r.dataset.ok);if(o){o.dd=r.dataset.dd;act(o)}});

// menu, files, sharing
function menu(){const pe=par(T0()),T=(k,ic,l)=>`<button data-th="${k}" class="${st.theme===k?'on':''}">${svg(ic)}${l}</button>`,
  row=(a,ic,t,sb,c)=>`<button class="mr${c?' r':''}" data-act="${a}">${svg(ic)}<span><b>${t}</b>${sb?`<small>${sb}</small>`:''}</span></button>`;
  $('#mb').innerHTML=`<div class="mh2"><h2>Podešavanja</h2><button class="ib g" data-act="x" aria-label="Zatvori">${svg('x')}</button></div>
  <div class="ms">Izgled</div><div class="seg th" style="--n:3">${T('auto','half','Auto')}${T('light','sun','Svetla')}${T('dark','moon','Tamna')}</div>
  <div class="ms">Raspored</div><div class="mg2"><div class="mr"><span><b>Ova nedelja je</b><small>Za naizmeničnu nastavu</small></span><div class="seg2"><button data-pw="1" class="${pe?'on':''}">Parna</button><button data-pw="0" class="${pe?'':'on'}">Neparna</button></div></div>
  <button class="mr" data-act="hd"><span><b>Sakrij završene časove</b><small>Samo za današnji dan</small></span><i class="tg2${st.hd?' on':''}"></i></button></div>
  <div class="ms">Podeli i sačuvaj</div><div class="mg2">${row('sh','share','Pošalji raspored','Link koji kolega otvori')}${row('ics','cal','Izvezi u kalendar','.ics za Google ili Apple kalendar')}${row('pr','print','Štampaj / PDF','Prikaz cele nedelje')}${row('exp','down','Rezervna kopija','Sačuva raspored u fajl')}${row('imp','up','Vrati iz kopije','Učitaj sačuvani fajl')}</div>
  <div class="mg2" style="margin-top:14px">${row('clr','trash','Obriši sve termine','',1)}</div>`;
  openOv('#ov2')}
async function sendFile(n,mt,txt){const f=new File([txt],n,{type:mt}),ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}return}
  const u=URL.createObjectURL(f),l=document.createElement('a');l.href=u;l.download=n;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Sačuvano: '+n)}
function ics(){const z=d=>dk(d).replace(/-/g,''),t=m=>p2(Math.floor(m/60))+p2(m%60)+'00',c=s=>String(s||'').replace(/[,;\n]/g,' ');
  let o='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Raspored//SR\r\n';
  for(let i=0;i<150;i++){const d=addD(T0(),i);occ(d).filter(x=>!x.gone).forEach(x=>{o+=`BEGIN:VEVENT\r\nUID:${x.it.id}-${z(d)}-${x.s}@raspored\r\nDTSTAMP:${z(new Date())}T000000\r\nDTSTART:${z(d)}T${t(x.s)}\r\nDTEND:${z(d)}T${t(E0(x))}\r\nSUMMARY:${c(x.it.name||TY[x.it.t||'p'])}\r\nLOCATION:${c(x.room)}\r\nDESCRIPTION:${c(x.it.teacher)}\r\nEND:VEVENT\r\n`})}
  return o+'END:VCALENDAR\r\n'}
async function pack(o){const s=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('deflate-raw')),b=new Uint8Array(await new Response(s).arrayBuffer());return btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function unpack(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text())}
async function shareLink(){try{const u=location.origin+location.pathname+'#r='+await pack({items:st.items});
  if(navigator.share)await navigator.share({title:'Raspored',url:u});else{await navigator.clipboard.writeText(u);toast('Link kopiran')}}catch(e){toast('Deljenje nije uspelo')}}
$('#mn').onclick=menu;
$('#mb').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.th){st.theme=d.th;save();theme();menu();return}
  if(d.pw){st.pw={m:dk(mon(T0())),e:d.pw==='1'};save();menu();render();return}
  if(d.a){const o=AO,it=o.it;
    if(d.a==='ed')openForm('edit',o);else if(d.a==='mv')openForm('move',o);else if(d.a==='fu')openForm('future',o);else if(d.a==='rp')openForm('new',o,1);
    else if(d.a==='cx'){if(o.gone==='Otkazano')delete it.ex[o.k];else it.ex[o.k]={x:1};save();closeOv();render()}
    else if(d.a==='dl')delIt(it);else closeOv();return}
  const a=d.act;if(!a)return;
  if(a==='x')closeOv();
  else if(a==='hd'){st.hd=!st.hd;save();menu();render()}
  else if(a==='sh'){closeOv();shareLink()}
  else if(a==='ics'){closeOv();sendFile('raspored.ics','text/calendar',ics())}
  else if(a==='pr'){closeOv();vw='w';cd=fix(T0());render();setTimeout(()=>window.print(),300)}
  else if(a==='exp'){closeOv();sendFile('raspored-kopija.json','application/json',JSON.stringify(st))}
  else if(a==='imp')$('#fi').click();
  else if(a==='clr'){if(confirm('Obrisati sve termine? Ovo ne može da se poništi.')){st.items=[];save();closeOv();render()}}
  else if(a==='iz'||a==='id'){const n=IMP.map(i=>({...i,id:a==='id'?uid():i.id}));st.items=a==='iz'?n:st.items.concat(n);save();closeOv();render();toast('Raspored dodat')}});
$('#fi').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;
    if(confirm('Zameniti trenutni raspored sa ovom kopijom?')){st=Object.assign(st,d);migrate(st.items);save();theme();closeOv();render();toast('Raspored vraćen')}}catch(x){toast('Fajl nije ispravna kopija rasporeda')}e.target.value=''};r.readAsText(f)});
(async()=>{const m=/^#r=(.+)$/.exec(location.hash);if(!m)return;
  try{const d=await unpack(m[1]);if(!Array.isArray(d.items))throw 0;migrate(d.items);IMP=d.items;
    $('#mb').innerHTML=`<h2>Raspored od kolege</h2><div class="sub" style="margin-bottom:6px">${d.items.length} termina na linku</div><button class="mb" data-act="iz">Zameni moj raspored</button><button class="mb" data-act="id">Dodaj uz moj raspored</button><button class="mb" data-act="x" style="text-align:center">Odbaci</button>`;openOv('#ov2')}catch(e){}
  history.replaceState(null,'',location.pathname)})();

function theme(){st.theme==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',st.theme);$('#thb').innerHTML=svg(st.theme==='auto'?'half':st.theme==='light'?'sun':'moon')}
$('#thb').onclick=()=>{const o=['auto','light','dark'];st.theme=o[(o.indexOf(st.theme)+1)%3];save();theme();toast('Tema: '+{auto:'automatska',light:'svetla',dark:'tamna'}[st.theme])};
$('#add').onclick=()=>openForm('new');
$('#tu').onclick=()=>{if(undo)undo();undo=null;$('#ts').classList.remove('show')};
$('#td').onclick=()=>{cd=fix(T0());render()};
$('#sw').onclick=()=>{st.merge=!st.merge;save();render()};
$('#vs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){vw=b.dataset.v;render()}});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){cd=addD(mon(cd),+b.dataset.i);buzz();render()}});
function step(s){if(vw==='m')cd=fix(new Date(cd.getFullYear(),cd.getMonth()+s,1));else cd=fix(addD(cd,7*s));render()}
document.querySelectorAll('.ab').forEach(b=>b.onclick=()=>step(+b.dataset.s));
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null||document.querySelector('.ov.show'))return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<70)return;const s=dx>0?-1:1;
  if(vw==='d'){cd=addD(cd,s);render()}else step(s)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
theme();render();setInterval(render,20000);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script></body></html>
